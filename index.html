<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天才小说家 - AI小说创作助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        .prose {
            line-height: 1.8;
            color: #374151;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        input:focus, button:focus {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
        }
        .result-card {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease-out;
        }
        .result-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <!-- 验证部分 -->
    <div id="auth-section" class="max-w-4xl mx-auto p-6">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-xl font-bold mb-4">验证信息</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">授权码</label>
                    <input type="text" id="auth-code" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="请输入授权码">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Moonshot API密钥</label>
                    <input type="password" id="api-key" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="请输入API密钥">
                </div>
                <button onclick="verifyAuth()" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-colors">
                    验证
                </button>
            </div>
        </div>
    </div>

    <!-- 主要功能部分 -->
    <div id="main-section" class="max-w-4xl mx-auto p-6" style="display: none;">
        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-lg shadow-lg p-8 mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">天才小说家</h1>
            <p class="text-indigo-100">AI驱动的小说创作助手，帮助你构思完整的故事框架</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">小说标题</label>
                <input type="text" id="novel-title" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="请输入小说标题">
            </div>
            <button onclick="generateStory()" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-colors">
                生成故事框架
            </button>
        </div>

        <div id="loading" class="text-center p-4" style="display: none;">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
        </div>

        <div id="result" class="bg-white rounded-lg shadow-lg p-6 prose max-w-none result-card" style="display: none;">
        </div>
    </div>

    <script>
        let authInfo = {
            authCode: '',
            apiKey: ''
        };

        async function verifyAuth() {
            const authCode = document.getElementById('auth-code').value.trim();
            const apiKey = document.getElementById('api-key').value.trim();

            if (!authCode || !apiKey) {
                alert('请输入授权码和API密钥');
                return;
            }

            // 显示加载状态
            const button = document.querySelector('button');
            button.disabled = true;
            button.textContent = '验证中...';

            try {
                // 设置请求超时
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000); // 减少到5秒超时

                const response = await fetch('https://novel-ai-assistant.vercel.app/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        authCode: authCode,
                        apiKey: apiKey
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || '验证失败');
                }
                
                const data = await response.json();

                if (data.success) {
                    authInfo.authCode = authCode;
                    authInfo.apiKey = apiKey;
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                } else {
                    throw new Error(data.message || '验证失败');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    alert('验证请求超时，请重试');
                } else {
                    alert('验证失败: ' + error.message);
                }
                console.error('验证错误:', error);
            } finally {
                // 恢复按钮状态
                button.disabled = false;
                button.textContent = '验证';
            }
        }

        async function generateStory() {
            const title = document.getElementById('novel-title').value.trim();
            if (!title) {
                alert('请输入小说标题');
                return;
            }

            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const response = await fetch('https://novel-ai-assistant.vercel.app/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        apiKey: authInfo.apiKey
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.success) {
                    result.innerHTML = data.content.replace(/\n/g, '<br>');
                    result.style.display = 'block';
                    setTimeout(() => result.classList.add('visible'), 100);
                } else {
                    alert('生成失败: ' + data.message);
                }
            } catch (error) {
                loading.style.display = 'none';
                alert('生成出错: ' + error.message);
            }
        }
    </script>
</body>
</html>
