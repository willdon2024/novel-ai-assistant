<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天才小说家 - AI小说创作助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        .prose {
            line-height: 1.8;
            color: #374151;
        }
        /* 自定义滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* 输入框焦点效果 */
        input:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        /* 按钮悬停效果 */
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        /* 结果卡片渐变边框 */
        .result-card {
            position: relative;
            border-radius: 0.5rem;
            background: white;
            transition: opacity 0.3s ease;
        }
        .result-card::before {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            bottom: -2px;
            left: -2px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            border-radius: 0.6rem;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .result-card.has-content::before {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 to-purple-600">
    <!-- 验证部分 -->
    <div id="auth-section" class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-xl p-8">
            <h2 class="text-2xl font-bold mb-6">验证信息</h2>
            <div class="space-y-6">
                <div>
                    <label for="authCode" class="block text-sm font-medium text-gray-700 mb-1">授权码</label>
                    <input type="text" id="authCode" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-1">Moonshot API密钥</label>
                    <input type="password" id="apiKey" class="w-full px-4 py-2 border border-gray-300 rounded-md">
                </div>
                <button onclick="verifyAuth()" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-all">
                    验证授权
                </button>
            </div>
        </div>
    </div>

    <!-- 主要功能部分 -->
    <div id="main-section" class="container mx-auto px-4 py-8" style="display: none;">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-white mb-4">天才小说家</h1>
            <p class="text-xl text-indigo-100">AI驱动的小说创作助手</p>
        </header>

        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-lg shadow-xl p-6 mb-8">
                <input type="text" id="novelTitle" placeholder="请输入小说标题..." 
                    class="w-full px-4 py-2 text-lg border border-gray-300 rounded-md">
                <button onclick="generateStory()" class="w-full mt-4 bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-all">
                    生成故事框架
                </button>
            </div>

            <div id="loadingSpinner" class="hidden">
                <div class="flex justify-center items-center space-x-2">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>
                    <span class="text-white">正在生成...</span>
                </div>
            </div>

            <div id="result" class="result-card p-6">
                <div class="prose max-w-none">
                    <!-- 生成的内容将在这里显示 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let authInfo = {
            authCode: '',
            apiKey: ''
        };

        async function verifyAuth() {
            const authCode = document.getElementById('authCode').value;
            const apiKey = document.getElementById('apiKey').value;

            if (!authCode || !apiKey) {
                alert('请输入授权码和API密钥');
                return;
            }

            const verifyButton = event.target;
            verifyButton.textContent = '验证中...';
            verifyButton.disabled = true;

            try {
                console.log('开始验证请求');  // 调试日志
                const response = await fetch('https://novel-ai-assistant.vercel.app/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        authCode: authCode,
                        apiKey: apiKey
                    })
                });

                console.log('收到响应:', response.status);  // 调试日志
                const data = await response.json();
                console.log('响应数据:', data);  // 调试日志

                if (response.ok && data.status === 'success') {
                    authInfo.authCode = authCode;
                    authInfo.apiKey = apiKey;
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                } else {
                    throw new Error(data.error || '验证失败，请检查授权码和API密钥');
                }
            } catch (error) {
                console.error('验证请求失败:', error);  // 调试日志
                alert(error.message || '验证请求失败，请稍后重试');
            } finally {
                verifyButton.textContent = '验证授权';
                verifyButton.disabled = false;
            }
        }

        async function generateStory() {
            const title = document.getElementById('novelTitle').value;
            if (!title) {
                alert('请输入小说标题');
                return;
            }

            const loadingSpinner = document.getElementById('loadingSpinner');
            const result = document.getElementById('result');
            
            loadingSpinner.classList.remove('hidden');
            result.classList.remove('has-content');

            try {
                const response = await fetch('https://novel-ai-assistant.vercel.app/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Code': authInfo.authCode,
                        'X-API-Key': authInfo.apiKey
                    },
                    body: JSON.stringify({
                        title: title
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    result.querySelector('.prose').innerHTML = data.content.replace(/\n/g, '<br>');
                    result.classList.add('has-content');
                } else {
                    alert(data.error || '生成失败，请重试');
                }
            } catch (error) {
                console.error('生成请求失败:', error);
                alert('生成请求失败，请稍后重试');
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
